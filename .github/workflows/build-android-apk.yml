name: Build Android APK

on:
  workflow_call:
    inputs:
      checkout_ref:
        required: false
        type: string
  workflow_dispatch:
  push:
    paths-ignore:
      - ".github/workflows/para2github.yml"
      - "paratranz/**"
      - "tools/**"
  pull_request:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out SlashEM
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Apply Paratranz translations
        run: python3 tools/paratranz_sync.py apply

      - name: Set up Java for Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null

      - name: Install Android packages
        run: sdkmanager "platforms;android-30" "build-tools;30.0.3"

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y bison flex gcc-multilib g++-multilib

      - name: Download legacy Android NDK
        run: |
          curl -L https://dl.google.com/android/ndk/android-ndk-r9d-linux-x86_64.tar.bz2 -o "$RUNNER_TEMP/android-ndk-r9d-linux-x86_64.tar.bz2"
          tar -xjf "$RUNNER_TEMP/android-ndk-r9d-linux-x86_64.tar.bz2" -C "$RUNNER_TEMP"

      - name: Build SlashEM native assets
        env:
          NDK: ${{ runner.temp }}/android-ndk-r9d
        run: |
          sh sys/android/setup.sh
          make install

      - name: Set up Java for Gradle build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 6.7.1

      - name: Assemble debug APK
        run: gradle --no-daemon -p android-ci :app:assembleDebug

      - name: Prepare release metadata
        if: github.event_name != 'pull_request'
        id: release_meta
        run: |
          tag_name="prerelease-${GITHUB_RUN_NUMBER}"
          source_apk="$(find android-ci/app/build/outputs/apk/debug -name '*.apk' | head -n 1)"
          if [ -z "$source_apk" ]; then
            echo "No APK found" >&2
            exit 1
          fi
          release_apk="android-ci/app/build/outputs/apk/debug/SlashEM-cn-v0.0.7E7F3-${tag_name}.apk"
          cp "$source_apk" "$release_apk"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "apk_path=$release_apk" >> "$GITHUB_OUTPUT"

      - name: Upload renamed APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SlashEM-debug-apk
          path: ${{ steps.release_meta.outputs.apk_path }}

      - name: Upload APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SlashEM-debug-apk
          path: android-ci/app/build/outputs/apk/debug/*.apk

      - name: Create prerelease tag and attach APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.tag_name }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: ${{ steps.release_meta.outputs.apk_path }}
          generate_release_notes: true
