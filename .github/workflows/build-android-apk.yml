name: Build Android APK

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out SlashEM
        uses: actions/checkout@v4

      - name: Check out ForkFront
        uses: actions/checkout@v4
        with:
          repository: gurrhack/ForkFront-Android
          path: ForkFront-Android

      - name: Set up Java for Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null

      - name: Install Android packages
        run: sdkmanager "platforms;android-30" "build-tools;30.0.3"

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y bison flex gcc-multilib g++-multilib

      - name: Download legacy Android NDK
        run: |
          curl -L https://dl.google.com/android/ndk/android-ndk-r9d-linux-x86_64.tar.bz2 -o "$RUNNER_TEMP/android-ndk-r9d-linux-x86_64.tar.bz2"
          tar -xjf "$RUNNER_TEMP/android-ndk-r9d-linux-x86_64.tar.bz2" -C "$RUNNER_TEMP"

      - name: Build SlashEM native assets
        env:
          NDK: ${{ runner.temp }}/android-ndk-r9d
        run: |
          sh sys/android/setup.sh
          make install

      - name: Set up Java for Gradle build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 6.7.1

      - name: Assemble debug APK
        run: gradle --no-daemon -p android-ci :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SlashEM-debug-apk
          path: android-ci/app/build/outputs/apk/debug/*.apk
